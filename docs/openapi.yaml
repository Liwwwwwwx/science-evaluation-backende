        - $ref: '#/components/parameters/IdempotencyKeyUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已归档
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/RuleRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 生效版禁止归档（RULE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 规则写入未启用（RULE_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/services:
    get:
      tags: [统一运行]
      summary: 可用测评服务
      description: 需要 `team-services:read`。`enabled` 表示适配器已配置、具备写权限且写入已启用；可用状态不代表实时探活成功。
      responses:
        '200':
          description: 主服务与五类下游服务列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, label, enabled, scoring]
                      properties:
                        key:
                          type: string
                          enum: [mission-material, literature, literature-aircraft, alloy, synthesis, new-material]
                        label:
                          type: string
                        enabled:
                          type: boolean
                        scoring:
                          type: string
                          enum: [independent, absent]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/evaluation/unified/mission-daily:
    get:
      tags: [统一运行]
      summary: Mission 每日计划状态
      description: 需要 `team-services:read`。计划状态不等于健康探活。
      responses:
        '200':
          description: 调度配置与最近一次计划
          content:
            application/json:
              schema:
                type: object
                required: [enabled, ready, time, timeZone, targetCount, last]
                properties:
                  enabled:
                    type: boolean
                  ready:
                    type: boolean
                  time:
                    type: string
                    description: 每日触发时间（北京时间）
                  timeZone:
                    type: string
                  targetCount:
                    type: integer
                  last:
                    type: object
                    nullable: true
                    properties:
                      date:
                        type: string
                        format: date
                      id:
                        type: string
                        format: uuid
                      state:
                        type: string
                      reason:
                        type: string
                        nullable: true
                      count:
                        type: integer
                      items:
                        type: array
                        items:
                          type: object
                          description: 计划题目及对应运行状态（runId/status/scores）
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 每日测评状态尚未配置（MISSION_DAILY_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/history:
    get:
      tags: [统一运行]
      summary: 读取当前账号的近期对话
      description: 需要 team-services:read；只返回最近 50 条未被当前用户移除的人工运行。存储未迁移时返回原始历史且 storageReady 和 canManage 为 false。
      responses:
        '200':
          description: 最近对话、存储状态及管理权限
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/evaluation/unified/history/{runId}:
    post:
      tags: [统一运行]
      summary: 重命名或从当前账号的侧栏移除对话
      description: 需要读写权限、同源和运行写开关。只修改当前用户的侧栏状态，不修改原始运行或统计。
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [rename, remove]
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: rename 时必填，remove 时不得提供。
      responses:
        '200':
          description: 更新成功
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 人工运行不存在或已从侧栏移除
        '503':
          description: 写入未启用或对话管理存储未迁移

  /api/evaluation/unified/question-scores:
    get:
      tags: [统一运行]
      summary: 按题目查询各服务最近评分
      description: 需要 `team-services:read`。题库修改版本后不沿用旧分。
      parameters:
        - name: items
          in: query
          required: true
          description: URL 编码的 JSON 数组，最多 50 个 `{"id":"...","datasetVersion":"..."}`
          schema:
            type: string
      responses:
        '200':
          description: 每题每服务最近一次运行的评分摘要
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        runId:
                          type: string
                          format: uuid
                        questionId:
                          type: string
                        datasetVersion:
                          type: string
                        serviceKey:
                          type: string
                        status:
                          type: string
                        startedAt:
                          type: string
                          format: date-time
                          nullable: true
                        scores:
                          type: object
                          additionalProperties: true
                          description: 两模型轻量分数摘要（同 ScoreSummary）
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 评分记录尚未配置（SCORING_STORAGE_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/runs:
    post:
      tags: [统一运行]
      summary: 创建统一运行
      description: |
        需要 `team-services:write`、同源校验、运行写入开关 `EVALUATION_RUN_WRITE_ENABLED=true`，
        以及 1–128 个可打印 ASCII 字符的 `Idempotency-Key`。来源统一为人工运行（manual）。
        题库来源字段（questionId/datasetVersion/sourceType）须完整，后端核验有效版本与原题。
        成功返回 201；排队执行时也立即返回，经 SSE 或详情接口获取进度。执行完成后自动独立评分。
        每服务最多 5 个并发、进程合计 25 个，队列上限 300，超出拒绝（429 UNIFIED_EVAL_BUSY）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceKey, question]
              properties:
                serviceKey:
                  type: string
                  enum: [mission-material, literature, literature-aircraft, alloy, synthesis, new-material]
                question:
                  type: string
                  description: 题面；人工提问 8–500 字符（synthesis 8–200）
                questionId:
                  type: string
                  description: 题库来源时必填
                datasetVersion:
                  type: string
                  description: 题库来源时必填
                sourceType:
                  type: string
                  enum: [fixed, random]
                  description: 题库来源时必填
      responses:
        '201':
          description: 已创建（或幂等恢复）
          content:
            application/json:
              schema:
                type: object
                required: [runId, serviceKey]
                properties:
                  runId:
                    type: string
                    format: uuid
                  serviceKey:
                    type: string
                  reused:
                    type: boolean
                    description: 幂等键命中原请求时为 true；排队路径可能缺省
        '400':
          description: 服务/题目/来源/幂等键无效（UNIFIED_EVAL_* / QUESTION_SOURCE_INVALID）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 幂等键已用于不同请求（UNIFIED_EVAL_IDEMPOTENCY_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 等待队列已满（UNIFIED_EVAL_BUSY）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 运行写入未启用或存储未配置（EVALUATION_WRITE_DISABLED / UNIFIED_EVAL_IDEMPOTENCY_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [统一运行]
      summary: 运行记录列表
      description: 需要 `team-services:read`。沿用管理平台授权用户共享查看范围。
      parameters:
        - name: origin
          in: query
          schema: { type: string, enum: [manual, automation, legacy] }
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
          description: 题面或运行 ID 模糊搜索
        - name: domain
          in: query
          schema: { type: string }
          description: 领域 key 或 `unclassified`
        - name: questionId
          in: query
          schema: { type: string, maxLength: 200 }
        - name: datasetVersion
          in: query
          schema: { type: string, maxLength: 100 }
        - name: from
          in: query
          schema: { type: string, format: date }
          description: 按北京时间过滤开始日期（含）
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 运行分页（含两模型轻量分数摘要与 canRescore）
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, pageSize]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunListItem'
                  total:
                    type: integer
                  page:
                    type: integer
                  pageSize:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 统一运行记录尚未配置（UNIFIED_EVAL_STORAGE_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/runs/{runId}:
    get:
      tags: [统一运行]
      summary: 运行详情
      description: |
        返回回答、题目版本快照、结构化结果与独立评分。非本进程的运行只返回已保存快照
        （`recoveryState=snapshot_only`），不自动重跑。`canRescore` 只表示当前权限/开关/快照允许重评。
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: 运行快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetail'
        '400':
          description: 运行 ID 无效（INVALID_INPUT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 运行不存在（UNIFIED_EVAL_RUN_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/runs/{runId}/events:
    get:
      tags: [统一运行]
      summary: 运行事件流（SSE）
      description: |
        `text/event-stream`：先发送 `snapshot` 事件（含 `live` 标记），随后按序发送
        `execution` / `text` / `state` / `run` / `score` / `done` / `error` 事件。
        客户端断线不会取消执行，可重新订阅；本进程无执行状态时只发送快照后关闭。
        每 15 秒发送心跳注释行；慢连接缓冲上限 8MiB，超限断开。
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: 事件流
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: 运行 ID 无效（INVALID_INPUT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 运行不存在（UNIFIED_EVAL_RUN_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/runs/{runId}/reply:
    post:
      tags: [统一运行]
      summary: 人工答复运行中的交互请求
      description: |
        保留的兼容接口：仅本进程发起人可答复本人未结束的运行；重复/过期答复拒绝。
        正常新运行的 `requirement_review_request` 已由平台自动答复，不再进入人工等待。
      parameters:
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 服务特定答复内容（如 checkpoint.reply）
      responses:
        '200':
          description: 已答复
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  runId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 只能答复本人发起的运行（FORBIDDEN / INVALID_ORIGIN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 当前进程无法答复此运行（REVIEW_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 运行写入未启用（EVALUATION_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/runs/{runId}/rerun:
    post:
      tags: [统一运行]
      summary: 清除旧输出并重新测评
      description: |
        需要读写权限、同源校验、运行写入开关与 Idempotency-Key。仅支持已结束的人工运行。
        在同一事务内清除旧记录的输出、成果索引和评分并创建新运行，沿用原题、服务与规则快照。
        保留原记录题目、时间和新运行入口；不删除被测服务上的外部文件。同键只创建一次。
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: 新运行已创建或恢复，返回 runId 和 reused
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 原运行尚未结束、已重跑、服务变化或请求冲突
        '503':
          description: 运行写入或重新测评存储不可用

  /api/evaluation/unified/runs/{runId}/score:
    post:
      tags: [统一运行]
      summary: 重新评分
      description: |
        只对保存的完整执行结果重评，不调用被测服务。请求体必须为空对象 `{}`；
        需要 `team-services:write`、同源校验、运行写入开关与 1–128 字符 `Idempotency-Key`。
        同轮进行中返回 409；并发实例通过数据库轮次条件抢占；最多保留 20 轮评分历史。
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: 重评已受理
          content:
            application/json:
              schema:
                type: object
                required: [runId, attemptId, reused]
                properties:
                  runId:
                    type: string
                    format: uuid
                  attemptId:
                    type: string
                    format: uuid
                  reused:
                    type: boolean
        '400':
          description: 幂等键无效或请求体非空（IDEMPOTENCY_INVALID / INVALID_INPUT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 仍在执行或评分/快照不完整/历史达到上限（SCORING_BUSY / RUN_INCOMPLETE / SCORING_HISTORY_LIMIT / SCORING_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 评分繁忙（SCORING_BUSY）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 评分尚未配置（SCORING_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/runs/{runId}/artifacts/{index}:
    get:
      tags: [统一运行]
      summary: 只读代理运行产物
      description: |
        使用现有会话与 `team-services:read`，按运行已保存的产物索引只读代理，不接受客户端 URL。
        仅允许该运行服务的任务资产/文件路径；禁止凭据、重编码路径、重定向及 HTML/SVG 等主动内容。
        15 秒超时、32MiB 上限，固定扩展名 MIME，附 nosniff/sandbox 响应头。
        403/404/413/415/502 分别表达来源、缺失、大小、类型和上游错误。
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 999 }
      responses:
        '200':
          description: 产物内容（图片/GIF/GLB/文本等白名单类型）
          headers:
            Content-Type:
              schema: { type: string }
            Content-Disposition:
              schema: { type: string }
            X-Content-Type-Options:
              schema: { type: string, enum: [nosniff] }
            Content-Security-Policy:
              schema: { type: string }
        '403':
          description: 来源不允许
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 产物缺失
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 超过 32MiB 上限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 类型不允许
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: 上游错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

