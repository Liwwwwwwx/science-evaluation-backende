  /api/evaluation/unified/batches/{batchId}/comparison:
    get:
      tags: [测评批次]
      summary: 批次环比
      description: |
        Mission 每日计划可匹配 `question_id + dataset_version` 做逐题环比；试跑批次通常只能服务汇总环比。
        两批次规则哈希或评分模型不同时标记不可比，不直接相减。
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: against
          in: query
          schema: { type: string, default: previous }
          description: 目标批次 UUID，或 `previous`（上一同来源批次）
      responses:
        '200':
          description: 环比结果
          content:
            application/json:
              schema:
                type: object
                required: [base, comparable, mode, matchedQuestions, thresholdPoints, services, questions]
                properties:
                  base:
                    $ref: '#/components/schemas/BatchSummary'
                  previous:
                    allOf:
                      - $ref: '#/components/schemas/BatchSummary'
                      - nullable: true
                  comparable:
                    type: boolean
                  mode:
                    type: string
                  reason:
                    type: string
                    nullable: true
                  matchedQuestions:
                    type: integer
                  thresholdPoints:
                    type: number
                  services:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  questions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '400':
          description: 对比批次 ID 无效（INVALID_INPUT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: 批次存储尚未迁移（BATCH_STORAGE_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

