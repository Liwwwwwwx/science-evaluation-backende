                allOf:
                  - $ref: '#/components/schemas/DailyReport'
                  - type: object
                    properties:
                      canGenerate:
                        type: boolean
        '400':
          description: 测评日期无效（INVALID_DATE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 尚无该日期的报告（REPORT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 报告存储尚未迁移（REPORT_MIGRATION_REQUIRED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/daily-reports/{date}/markdown:
    get:
      tags: [每日报告]
      summary: 下载报告 Markdown
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Markdown 附件（`daily-evaluation-<date>.md`）
          content:
            text/markdown:
              schema:
                type: string
        '400':
          description: 测评日期无效（INVALID_DATE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 尚无该日期的报告（REPORT_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 报告尚未生成完成（REPORT_NOT_READY）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 报告存储尚未迁移（REPORT_MIGRATION_REQUIRED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/unified/daily-reports/{date}/generate:
    post:
      tags: [每日报告]
      summary: 手动生成/重试报告
      description: |
        需要 `team-services:write`、同源校验、报告写开关 `EVALUATION_DAILY_REPORT_WRITE_ENABLED=true`
        与 1–128 个可打印 ASCII 字符的 `Idempotency-Key`。不重新发题和评分；
        本轮任务或评分尚未结束时返回 409。
      parameters:
        - name: date
          in: path
          required: true
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '202':
          description: 已开始生成
          content:
            application/json:
              schema:
                type: object
                required: [state]
                properties:
                  state:
                    type: string
                    enum: [generating]
        '400':
          description: 日期/幂等键/请求体无效（INVALID_DATE / INVALID_KEY / INVALID_INPUT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 该日期没有已保存的自动测评记录（REPORT_NO_DATA）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 本轮任务或评分尚未结束（REPORT_WAITING）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 报告生成未启用或存储未迁移（REPORT_WRITE_DISABLED / REPORT_MIGRATION_REQUIRED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: evaluation_session
      description: 登录会话 Cookie（HttpOnly、SameSite=Lax；HTTPS 下含 Secure）
    ServiceToken:
      type: http
      scheme: bearer
      description: 部署环境提供的 EVALUATION_SERVICE_TOKEN（至少 32 字节），仅限可信服务端调用

  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RuleId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
      description: 1–128 个可打印 ASCII 字符（0x21–0x7e）的幂等键
    IdempotencyKeyUuid:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: 必须为 UUID 格式的幂等键

  responses:
    BadRequest:
      description: 参数无效（INVALID_INPUT / INVALID_JSON / 各业务 400 错误码）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 未登录或会话失效（UNAUTHORIZED）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 权限不足或来源无效（FORBIDDEN / INVALID_ORIGIN）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 资源不存在（NOT_FOUND / *_NOT_FOUND）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string

    User:
      type: object
      required: [id, username, name, permissions]
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
            description: 如 team-services:read、team-services:write

    Question:
      type: object
      required: [id, layer, sourceType, question, datasetVersion, status]
      properties:
        id:
          type: string
          description: 稳定题目 ID（固定题为 `服务:案例`，随机题为 `rnd:服务:指纹`，领域题为独立 UUID 族）
        layer:
          type: string
          description: base / override 等
        serviceKey:
          type: string
          nullable: true
        domainKey:
          type: string
          nullable: true
          description: 九个领域之一的 key；null 表示未分类
        sourceType:
          type: string
          enum: [fixed, random]
        question:
          type: string
        fingerprint:
          type: string
          nullable: true
        criteria:
          type: object
          nullable: true
          description: 专属评分规则（旧固定题覆盖）
        criteriaVersion:
          type: string
          nullable: true
        datasetVersion:
          type: string
        status:
          type: string
          description: active / retired 等
        retiredReason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true

    GenerateRequest:
      type: object
      required: [count]
      properties:
        serviceKey:
          type: string
          enum: [mission-material, alpha-rsi, alloy, literature, literature-aircraft, synthesis, new-material]
          description: 服务维度出题（与 domainKey 互斥）；focus=custom 时必须提供 topic
        domainKey:
          type: string
          description: 领域维度出题（与 serviceKey 互斥）
        topic:
          type: string
          maxLength: 500
          description: 自定义主题；focus=custom 时必填
        focus:
          type: string
          enum: [general, principles, design, comparison, validation, diagnosis, custom]
          default: general
          description: 出题方向；general 为综合出题
        count:
          type: integer
          minimum: 1
          maximum: 10

    GenerateResponse:
      type: object
      required: [items, model]
      properties:
        items:
          type: array
          items:
            type: object
            required: [question]
            properties:
              serviceKey:
                type: string
                description: 服务维度出题时返回
              domainKey:
                type: string
                description: 领域维度出题时返回
              question:
                type: string
        model:
          type: string
          nullable: true

    StandardsContent:
      type: object
      required: [domain, taskType, explicitRequirements, evaluationCriteria, missingInformation]
      properties:
        domain:
          type: string
        taskType:
          type: string
        explicitRequirements:
          type: array
          maxItems: 15
          items:
            type: object
            required: [requirement, critical, source]
            properties:
              requirement:
                type: string
                maxLength: 500
              critical:
                type: boolean
              source:
                type: string
                maxLength: 500
                description: 必须逐字摘自题目原文
        evaluationCriteria:
          type: array
          maxItems: 20
          items:
            type: object
            required: [name, category, description, howToJudge]
            properties:
              name:
                type: string
                maxLength: 120
              category:
                type: string
                enum: [required, recommended, needs_verification]
              description:
                type: string
                maxLength: 600
              howToJudge:
                type: string
                maxLength: 600
              source:
                type: string
                maxLength: 500
                nullable: true
                description: required 类必须逐字摘自题目原文
        missingInformation:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 500

    StandardsDocument:
      allOf:
        - $ref: '#/components/schemas/StandardsContent'
        - type: object
          required: [verification, model]
          properties:
            verification:
              type: object
              required: [status, message]
              properties:
                status:
                  type: string
                  enum: [not_verified]
                message:
                  type: string
                  description: 声明 AI 生成、未做外部核验
            model:
              type: string
              nullable: true

    SavedStandard:
      type: object
      required: [id, state, question, content]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [draft, confirmed, superseded]
        question:
          type: string
        content:
          $ref: '#/components/schemas/StandardsContent'
        model:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true

    DirectScoreJudge:
      type: object
      required: [status, model]
      properties:
        status:
          type: string
          enum: [ready, failed, unavailable]
        model:
          type: string
          nullable: true
        score:
          type: number
          minimum: 0
          maximum: 100
          description: status=ready 时必有，0–100 一位小数
        summary:
          type: string
        criteria:
          type: array
          maxItems: 50
          items:
            type: object
            required: [criterion, status, reason, evidence]
            properties:
              id:
                type: string
                description: 关联标准项编号（如 C1）
              criterion:
                type: string
              status:
                type: string
                enum: [met, partial, missing, unclear]
              reason:
                type: string
              evidence:
                type: string
                nullable: true
                description: 可核对的输出原文（多段以换行连接）
              evidenceUnverified:
                type: boolean
                description: 依据未能在输出中核对时标记，状态降为 unclear
              standardUnverified:
                type: boolean
                description: 该评价项未能与标准核对
        suggestions:
          type: array
          maxItems: 10
          items:
            type: string
        attempts:
          type: integer
          description: 模型调用次数（1–2）
        provisional:
          type: boolean
          description: 存在未核对依据、缺项等告警时为 true，分数为待复核参考分
        evidenceWarning:
          type: string
          nullable: true
        error:
          type: string
          description: status=failed/unavailable 时的原因说明

    DirectScoreResponse:
      type: object
      required: [scores, redacted, note]
      properties:
        scores:
          type: object
          required: [deepSeekScore, qwenScore]
          properties:
            deepSeekScore:
              $ref: '#/components/schemas/DirectScoreJudge'
            qwenScore:
              $ref: '#/components/schemas/DirectScoreJudge'
        redacted:
          type: boolean
          description: 输入中的常见凭据信息已脱敏时为 true
        note:
          type: string
          description: 模型评分仅供参考、未做独立核验的固定说明

    RuleConfig:
      type: object
      required: [weights, passScore, markdownGate, contentInstructions, completionInstructions, experienceInstructions, efficiencyRules]
      properties:
        weights:
          type: object
          required: [readability, professionalism, visualAids]
          properties:
            readability:
              type: integer
              minimum: 0
              maximum: 100
            professionalism:
              type: integer
              minimum: 0
              maximum: 100
            visualAids:
              type: integer
              minimum: 0
              maximum: 100
          description: 三项整数合计须为 100，且可读性+专业性大于 0
        passScore:
          type: number
          minimum: 0
          maximum: 100
        markdownGate:
          type: boolean
          description: Markdown 机检是否纳入合格门槛
        contentInstructions:
          type: string
          maxLength: 6000
        completionInstructions:
          type: string
          maxLength: 6000
        experienceInstructions:
          type: string
          maxLength: 6000
        efficiencyRules:
          type: array
          maxItems: 20
          items:
            type: object
            required: [serviceKey, phaseKey, label, warningSeconds, criticalSeconds]
            properties:
              serviceKey:
                type: string
                description: '`*` 表示通用；同阶段具体服务配置优先'
              phaseKey:
                type: string
              label:
                type: string
                maxLength: 80
              warningSeconds:
                type: integer
                minimum: 1
              criticalSeconds:
                type: integer
                maximum: 86400
                description: 须大于 warningSeconds 且不超过 86400

    RuleSnapshot:
      type: object
      required: [id, version, name, hash, config]
      properties:
        id:
          type: string
        version:
          type: integer
        name:
          type: string
        publishedAt:
          type: string
          format: date-time
          nullable: true
        hash:
          type: string
          description: 规则配置哈希
        config:
          $ref: '#/components/schemas/RuleConfig'

    RuleRecord:
      type: object
      required: [id, version, revision, name, status, config]
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          description: 规则版本号（内置规则为 0）
        revision:
          type: integer
          description: 草稿修订号，用于乐观并发控制
        name:
          type: string
        status:
          type: string
          description: draft / published / archived
        config:
          $ref: '#/components/schemas/RuleConfig'
        changeNote:
          type: string
          nullable: true
        createdBy:
          type: string
          nullable: true
        updatedBy:
          type: string
          nullable: true
        publishedBy:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true

    ScoreSummary:
      type: object
      description: 列表/摘要中的单评委轻量分数
      properties:
        status:
          type: string
          description: pending / ready / provisional / failed / unavailable / absent / skipped 等
        model:
          type: string
          nullable: true
        total:
          type: number
          nullable: true
          description: 0–100 总分（quality.total）
        taskStatus:
          type: string
          nullable: true
          description: 交付完成状态
        provisional:
          type: boolean
          description: 评分输入被截断时为 true

    RunListItem:
      type: object
      required: [runId, serviceKey, status, startedAt]
      properties:
        runId:
          type: string
          format: uuid
        serviceKey:
          type: string
        origin:
          type: string
          enum: [manual, automation, legacy]
        question:
          type: string
        questionId:
          type: string
          nullable: true
        datasetVersion:
          type: string
          nullable: true
        questionSourceType:
          type: string
          nullable: true
        batchId:
          type: string
          nullable: true
        domainKey:
          type: string
          nullable: true
        status:
          type: string
          enum: [queued, running, scoring, done, error]
        answer:
          type: string
          description: 列表通常为空串，详情接口返回完整回答
        answerTruncated:
          type: boolean
        scores:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ScoreSummary'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          nullable: true
        canRescore:
          type: boolean
        canRerun:
          type: boolean

    RunDetail:
      allOf:
        - $ref: '#/components/schemas/RunListItem'
        - type: object
          properties:
            nativeRunId:
              type: string
              nullable: true
              description: 被测服务的原生任务 ID
            run:
              type: object
              nullable: true
              description: |
                原生执行快照：details（结构化状态/协议帧）、status、verdict、checks、markdownSyntax、
                scoring（评分轮次/租约/历史）、ruleSnapshot（创建时固化的规则快照）、serviceAddress、
                elapsedMs、error 等；字段随服务适配器而异。
            scores:
              type: object
              nullable: true
              description: 完整独立评分（含评语、亮点、不足、逐要求证据），按 deepSeekScore/qwenScore 键
            scoreError:
              type: string
              nullable: true
            persistenceError:
              type: boolean
            error:
              type: string
              nullable: true
            canReply:
              type: boolean
            canRescore:
              type: boolean
            recoveryState:
              type: string
              enum: [snapshot_only]
              description: 非本进程运行仅返回已保存快照
            executionStatus:
              type: string
              enum: [queued, running, succeeded, failed]
            scoringStatus:
              type: string
              description: pending / running / ready / partial / failed / unavailable / absent / unknown

    BatchTotals:
      type: object
      properties:
        planned:
          type: integer
        total:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
        timeout:
          type: integer
        unfinished:
          type: integer
        queued:
          type: integer
        running:
          type: integer
        scoring:
          type: integer

    JudgeSummary:
      type: object
      properties:
        mean:
          type: number
          nullable: true
          description: 可用分数均分（一位小数）；无样本为 null
        count:
          type: integer
        ready:
          type: integer
        provisional:
          type: integer
        pending:
          type: integer
        failed:
          type: integer
        unavailable:
          type: integer
        absent:
          type: integer
        invalid:
          type: integer
        model:
          type: string
          nullable: true

    BatchSummary:
      type: object
      required: [batchId, date, source, state, planned]
      properties:
        batchId:
          type: string
          format: uuid
        date:
          type: string
          format: date
          nullable: true
        source:
          type: string
          enum: [trial, mission]
        state:
          type: string
          enum: [preparing, dispatching, running, done, partial, failed]
        rawState:
          type: string
        planned:
          type: integer
        services:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              expected:
                type: integer
        totals:
          $ref: '#/components/schemas/BatchTotals'
        scores:
          type: object
          properties:
            deepSeek:
              $ref: '#/components/schemas/JudgeSummary'
            qwen:
              $ref: '#/components/schemas/JudgeSummary'
        startedAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true

    BatchRun:
      type: object
      required: [runId, question, serviceKey, status, execution]
      properties:
        runId:
          type: string
          format: uuid
        questionId:
          type: string
          nullable: true
        datasetVersion:
          type: string
          nullable: true
        question:
          type: string
        serviceKey:
          type: string
        status:
          type: string
        execution:
          type: string
          enum: [completed, failed, timeout, unfinished]
        scores:
          type: object
          properties:
            deepSeek:
              type: number
              nullable: true
            qwen:
              type: number
              nullable: true
        error:
          type: string
          nullable: true
        startedAt:
          type: string
        elapsedMs:
          type: integer
          nullable: true

    BatchDetail:
      allOf:
        - $ref: '#/components/schemas/BatchSummary'
        - type: object
          required: [services]
          properties:
            services:
              type: array
              description: 按服务展开的详情
              items:
                type: object
                properties:
                  serviceKey:
                    type: string
                  label:
                    type: string
                  expected:
                    type: integer
                  totals:
                    $ref: '#/components/schemas/BatchTotals'
                  scores:
                    type: object
                    properties:
                      deepSeek:
                        $ref: '#/components/schemas/JudgeSummary'
                      qwen:
                        $ref: '#/components/schemas/JudgeSummary'
                  maxElapsedMs:
                    type: integer
                    nullable: true
                  lowScores:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchRun'
                  failures:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchRun'

    DailyReportListItem:
      type: object
      required: [date, status]
      properties:
        date:
          type: string
          format: date
        status:
          type: string
          description: generating / ready / failed
        analysisState:
          type: string
          nullable: true
          description: ready / failed / unavailable
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        total:
          type: integer
        completed:
          type: integer
        unfinished:
          type: integer
        updatedAt:
          type: string
          format: date-time
        notificationState:
          type: string
          nullable: true
          description: sent / sending / unknown / failed / null

    DailyReport:
      type: object
      required: [date, status]
      properties:
        date:
          type: string
          format: date
        sourceHash:
          type: string
          nullable: true
        status:
          type: string
        analysisState:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        snapshot:
          type: object
          nullable: true
          description: 程序计算的统计快照（数量、完成/失败/超时、各服务均分等）
        analysis:
          type: object
          nullable: true
          description: 模型生成的跨服务案例总结（overview/issues/highlights/recommendations）
        markdown:
