openapi: 3.0.3
info:
  title: Science 测评后端 API
  version: 1.0.0
  description: |
    独立 Science 测评后端（默认监听 `127.0.0.1:7714`，Node.js 22）。

    通用约定：

    - 除 `/health` 与产物代理外，所有 JSON 响应均为 `application/json; charset=utf-8`，且带 `Cache-Control: no-store`。
    - 错误统一为 `{"error":{"code":"...","message":"..."}}`；code 为稳定错误码，message 为中文可展示文案。
    - 登录会话使用 HttpOnly Cookie `evaluation_session`（SameSite=Lax；HTTPS 下附加 Secure）。
      每次请求都会重新校验密码哈希状态、token_version 与当前权限。
    - 需要 `team-services:read` 的接口用于查看，需要 `team-services:write` 的接口用于写入；
      两权限任一即可通过基础认证，具体接口另行标注。
    - 所有写请求（POST/PUT/DELETE，除登录与令牌接口）校验 `Origin` 必须等于部署配置的
      `EVALUATION_PUBLIC_ORIGIN`，且 `Sec-Fetch-Site` 不得为 `cross-site`。
    - 请求体必须是 JSON 对象（`Content-Type: application/json`），超限返回 413 `REQUEST_TOO_LARGE`，
      非法 JSON 返回 400 `INVALID_JSON`，类型不符返回 415 `INVALID_CONTENT_TYPE`。
    - 多数写入功能由环境开关控制（题库写入、运行写入、规则写入、报告写入等），开关未开启时
      返回 503 及对应 `*_DISABLED` / `*_UNAVAILABLE` 错误码。
    - 模型评分均为参考分，不构成独立事实核验；接口不静默截断输入，超限直接拒绝。

    本文件由 `src/app.js` 及各 handler 模块的实际实现整理而成；行为描述另见仓库根 `README.md`。
servers:
  - url: http://127.0.0.1:7714
    description: 本地默认监听地址
  - url: https://{public-origin}
    description: 部署环境（EVALUATION_PUBLIC_ORIGIN，经 HTTPS 同源反向代理）
    variables:
      public-origin:
        default: evaluation.example.com

tags:
  - name: 健康
  - name: 认证
  - name: 题库
  - name: 题目生成
  - name: 评判标准
  - name: 直接评分
  - name: 评分规则
  - name: 统一运行
  - name: 测评批次
  - name: 每日报告

security:
  - SessionCookie: []

paths:
  /health:
    get:
      tags: [健康]
      summary: 存活状态
      description: 不需要鉴权。
      security: []
      responses:
        '200':
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                required: [ok, service]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  service:
                    type: string
                    enum: [science-evaluation]

  /api/auth/login:
    post:
      tags: [认证]
      summary: 登录
      description: |
        成功后设置 HttpOnly Cookie `evaluation_session`：勾选记住时最长 30 天，否则为会话 Cookie、
        服务端最长 12 小时。按连接 IP 15 分钟 30 次、按账号 15 分钟 10 次限流（单进程内存计数）。
        开启双因素时未提供 `totpCode` 返回 401 `2FA_REQUIRED`；`totpCode` 可为 TOTP 动态码或一次性备用码。
        `Origin` 必须与 `EVALUATION_PUBLIC_ORIGIN` 一致。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  maxLength: 100
                password:
                  type: string
                  maxLength: 100
                rememberMe:
                  type: boolean
                totpCode:
                  type: string
                  description: 双因素验证码或一次性备用码
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              description: '`evaluation_session=...; HttpOnly; SameSite=Lax`（HTTPS 下含 Secure）'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [ok, user]
                properties:
                  ok:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 凭据错误、需要或校验失败双因素（INVALID_CREDENTIALS / 2FA_REQUIRED / INVALID_2FA_CODE / UNAUTHORIZED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 账号没有测评平台访问权限（FORBIDDEN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 尝试次数过多（TOO_MANY_ATTEMPTS）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me:
    get:
      tags: [认证]
      summary: 当前用户与会话
      responses:
        '200':
          description: 当前登录用户
          content:
            application/json:
              schema:
                type: object
                required: [ok, user]
                properties:
                  ok:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/auth/logout:
    post:
      tags: [认证]
      summary: 退出当前会话
      responses:
        '200':
          description: 已退出；同时清空会话 Cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
          description: 请求来源无效（INVALID_ORIGIN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/logout-all:
    post:
      tags: [认证]
      summary: 退出测评平台所有会话
      responses:
        '200':
          description: 已退出该账号在测评平台的全部会话
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 请求来源无效（INVALID_ORIGIN）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/question-bank/access:
    get:
      tags: [题库]
      summary: 当前用户题库权限
      responses:
        '200':
          description: 权限列表
          content:
            application/json:
              schema:
                type: object
                required: [access]
                properties:
                  access:
                    type: object
                    required: [permissions]
                    properties:
                      permissions:
                        type: array
                        items:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/question-bank/questions:
    get:
      tags: [题库]
      summary: 题目分页列表
      description: 需要 `team-services:read`。默认仅返回 active 题目；同一题目 ID 多版本时按版本取有效一行。
      parameters:
        - name: service
          in: query
          schema: { type: string }
          description: 按服务过滤（mission-material / alpha-rsi / alloy / literature / literature-aircraft / synthesis / new-material）
        - name: source
          in: query
          schema: { type: string, enum: [fixed, random] }
          description: 按来源过滤
        - name: domain
          in: query
          schema: { type: string }
          description: 领域 key；`unclassified` 表示未分类
        - name: runnableFor
          in: query
          schema: { type: string }
          description: 返回可被该服务执行的基础层题目（服务无关领域题 + 该服务题）
        - name: status
          in: query
          schema: { type: string, enum: [active] }
          description: 当前仅支持 active
        - name: search
          in: query
          schema: { type: string, maxLength: 500 }
          description: 题面模糊搜索
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 1000000, default: 0 }
      responses:
        '200':
          description: 题目分页
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Question'
                  total:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 内置固定案例基线尚未登记（FIXED_CASE_BASELINE_MISSING）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/question-bank/question:
    get:
      tags: [题库]
      summary: 单个题目版本
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: datasetVersion
          in: query
          required: true
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: 题目详情
          content:
            application/json:
              schema:
                type: object
                required: [question]
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 题目不存在（QUESTION_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/question-bank/generate:
    post:
      tags: [题目生成]
      summary: AI 生成候选题（不写库）
      description: |
        需要 `team-services:write`。只调用已配置的出题模型生成候选，不写数据库；
        用户在前端确认后另行调用 `random-save` / `import` 保存。
        服务维度的 `serviceKey + focus=custom 时必填 topic` 与领域维度的 `domainKey` 二选一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: 候选题列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 生成失败或模型未返回有效题目（QUESTION_GENERATION_FAILED / QUESTION_GENERATION_EMPTY）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 出题模型未配置（QUESTION_GENERATION_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/team-services/evaluations/question-bank/generate:
    post:
      tags: [题目生成]
      summary: AI 生成候选题（服务端令牌预览接口）
      description: |
        仅限可信服务端调用：`Authorization: Bearer <EVALUATION_SERVICE_TOKEN>`（至少 32 字节）。
        浏览器不得直接使用该令牌；管理端代理必须先验证用户身份与 `team-services:write` 再转发。
        请求/响应结构与 `/api/question-bank/generate` 相同，只返回候选、不写库。
      security:
        - ServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '200':
          description: 候选题列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          description: 生成失败（QUESTION_GENERATION_FAILED / QUESTION_GENERATION_EMPTY）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 出题模型未配置（QUESTION_GENERATION_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/question-bank/import:
    post:
      tags: [题库]
      summary: 导入固定题
      description: 需要 `team-services:write`、同源校验，且题库写入开关 `EVALUATION_QUESTION_BANK_WRITE_ENABLED=true`。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [question]
                    properties:
                      serviceKey:
                        type: string
                        description: 服务维度导入时必填；与 domainKey 互斥
                      domainKey:
                        type: string
                        description: 领域维度导入时必填；与 serviceKey 互斥
                      question:
                        type: string
                        description: 题面，8–500 字符（synthesis 服务 8–200）
      responses:
        '201':
          description: 已导入
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 固定案例重复（FIXED_CASE_DUPLICATE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 题库写入尚未启用（QUESTION_BANK_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/question-bank/random-save:
    post:
      tags: [题库]
      summary: 保存确认后的随机题
      description: |
        需要 `team-services:write`、同源校验、题库写入开关。同服务同指纹优先复用已有活跃随机题；
        返回新增和复用数量。一次最多 10 道。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [question]
                    properties:
                      serviceKey:
                        type: string
                        description: 与 domainKey 互斥
                      domainKey:
                        type: string
                        description: 与 serviceKey 互斥
                      question:
                        type: string
      responses:
        '200':
          description: 保存结果
          content:
            application/json:
              schema:
                type: object
                required: [items, created, reused]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Question'
                  created:
                    type: integer
                  reused:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 本批题目重复（RANDOM_QUESTION_DUPLICATE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 题库写入尚未启用（QUESTION_BANK_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/question-bank/update:
    put:
      tags: [题库]
      summary: 编辑固定题/随机题题面
      description: |
        需要 `team-services:write`、同源校验、题库写入开关。随机题改题面以 `gen-edit-vN` 追加版本，
        旧版本退休且历史引用保留；仅 base 层固定题/随机题可编辑。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, datasetVersion, question]
              properties:
                id:
                  type: string
                  maxLength: 200
                datasetVersion:
                  type: string
                  maxLength: 100
                question:
                  type: string
                  description: 新题面
      responses:
        '200':
          description: 更新后的题目版本
          content:
            application/json:
              schema:
                type: object
                required: [question]
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 题目不存在（QUESTION_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 题目版本已停用（FIXED_CASE_VERSION_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 题库写入尚未启用（QUESTION_BANK_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/question-bank/delete:
    delete:
      tags: [题库]
      summary: 软删除（退休）题目
      description: 需要 `team-services:write`、同源校验、题库写入开关。仅退休记录，历史引用保留。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, datasetVersion]
              properties:
                id:
                  type: string
                  maxLength: 200
                datasetVersion:
                  type: string
                  maxLength: 100
      responses:
        '200':
          description: 退休后的题目
          content:
            application/json:
              schema:
                type: object
                required: [question]
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 题目不存在（QUESTION_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 题库写入尚未启用（QUESTION_BANK_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/question-bank/domain:
    put:
      tags: [题库]
      summary: 领域纠错
      description: |
        需要 `team-services:write`、同源校验、题库写入开关。不更换题目 ID；
        目标领域已有相同指纹题目时拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, datasetVersion, domainKey]
              properties:
                id:
                  type: string
                  maxLength: 200
                datasetVersion:
                  type: string
                  maxLength: 100
                domainKey:
                  type: string
                  description: 九个领域之一的 key
      responses:
        '200':
          description: 更新后的题目
          content:
            application/json:
              schema:
                type: object
                required: [question]
                properties:
                  question:
                    $ref: '#/components/schemas/Question'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 题目不存在（QUESTION_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 目标领域已有相同题目（FIXED_CASE_DUPLICATE / RANDOM_QUESTION_DUPLICATE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 题库写入尚未启用（QUESTION_BANK_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/standards:
    post:
      tags: [评判标准]
      summary: 生成评判标准
      description: |
        支持两种鉴权：服务端 `Authorization: Bearer <EVALUATION_SERVICE_TOKEN>`，或登录会话 +
        `team-services:write` + 同源校验。仅根据题面生成明确要求、评判项与待补充信息；
        不保存数据、不修改题库或评分规则、不联网查证。每条要求和必需项都必须引用输入原文。
      security:
        - ServiceToken: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  minLength: 8
                  maxLength: 4000
                  description: 问题原文
      responses:
        '200':
          description: 生成的评判标准
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardsDocument'
        '400':
          description: 题目长度无效（STANDARDS_INVALID / INVALID_JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: 生成失败或结果格式无效（STANDARDS_GENERATION_FAILED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 标准生成模型未配置（STANDARDS_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/question-standards:
    get:
      tags: [评判标准]
      summary: 读取题目已保存的评判标准
      description: 需要 `team-services:read`。按题目 ID 和数据集版本隔离，最多返回 100 条。
      parameters:
        - name: questionId
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: datasetVersion
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: 标准列表（确认版在前，其余按创建时间倒序）
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SavedStandard'
        '400':
          description: 题目版本参数无效（INVALID_QUESTION）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 标准存储尚未配置或未迁移（STANDARDS_UNAVAILABLE / STANDARDS_STORAGE_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [评判标准]
      summary: 保存单题标准草稿
      description: |
        需要 `team-services:write`、同源校验、题库写入开关。会重新核对题库中该题目版本的题面；
        题面不一致或已停用时返回 409。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionId, datasetVersion, question, content]
              properties:
                questionId:
                  type: string
                  maxLength: 200
                datasetVersion:
                  type: string
                  maxLength: 200
                question:
                  type: string
                  description: 当前题面（须与题库一致）
                content:
                  $ref: '#/components/schemas/StandardsContent'
                model:
                  type: string
                  maxLength: 120
                  description: 生成该标准所用模型（可选）
      responses:
        '200':
          description: 已保存为草稿
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum: [draft]
        '400':
          description: 参数或标准格式无效（INVALID_QUESTION / INVALID_STANDARDS）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 题目已停用或题面已变化（QUESTION_CHANGED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 标准保存未启用或存储未迁移（STANDARDS_WRITE_DISABLED / STANDARDS_STORAGE_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/question-standards/{id}/confirm:
    post:
      tags: [评判标准]
      summary: 确认标准版本
      description: |
        需要 `team-services:write`、同源校验、题库写入开关。确认新版本后旧的确认版转为
        superseded 并保留为历史；重复确认同一版本为幂等成功。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 确认结果
          content:
            application/json:
              schema:
                type: object
                required: [id, state]
                properties:
                  id:
                    type: string
                    format: uuid
                  state:
                    type: string
                    enum: [confirmed]
        '400':
          description: 标准标识无效（INVALID_STANDARD）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 标准不存在（STANDARD_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 状态已变化或题目已变化（STANDARD_CHANGED / QUESTION_CHANGED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 标准存储未启用/未迁移（STANDARDS_WRITE_DISABLED / STANDARDS_STORAGE_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/direct-score:
    post:
      tags: [直接评分]
      summary: 对已有输出直接评分
      description: |
        鉴权两种模式：受信服务端用 Bearer 服务令牌（EVALUATION_SERVICE_TOKEN）直连，
        无需会话与同源校验，浏览器不得使用令牌；网页调用用登录会话 +
        `team-services:write` 与同源校验，选用题库关联标准还需 `team-services:read`。
        仅调用配置的 DeepSeek 与千问评委，不调用被测服务，也不创建运行或保存结果；
        结果只在当前页面保留。每个评委独立返回，未配置/失败/超时分开标识，不取平均。
        输入中的常见凭据信息会在发送前脱敏，脱敏时返回 `redacted=true`。
        进程内最多 4 个并发直接评分，超出返回 429。
      security:
        - ServiceToken: []
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, answer, standard]
              properties:
                question:
                  type: string
                  minLength: 8
                  maxLength: 4000
                answer:
                  type: string
                  maxLength: 60000
                standard:
                  oneOf:
                    - type: object
                      required: [type, text]
                      properties:
                        type:
                          type: string
                          enum: [text]
                        text:
                          type: string
                          maxLength: 20000
                          description: 手写评分标准文本
                    - type: object
                      required: [type, id, questionId, datasetVersion]
                      properties:
                        type:
                          type: string
                          enum: [saved]
                        id:
                          type: string
                          format: uuid
                          description: 已保存标准的 ID
                        questionId:
                          type: string
                        datasetVersion:
                          type: string
                          description: 服务端会按题目 ID、版本及题面重新核对
      responses:
        '200':
          description: 双评委评分结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectScoreResponse'
        '400':
          description: 输入或标准无效（DIRECT_SCORE_INPUT_INVALID / INVALID_STANDARD）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 所选标准不存在（STANDARD_NOT_FOUND）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 题目已变化或停用（QUESTION_CHANGED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 评分繁忙（DIRECT_SCORE_BUSY）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 评分模型未配置或存储未就绪（DIRECT_SCORE_UNAVAILABLE / STANDARDS_UNAVAILABLE / STANDARDS_STORAGE_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/rules:
    get:
      tags: [评分规则]
      summary: 规则目录与生效版
      description: 需要 `team-services:read`。未迁移时只读返回内置规则并标记 `storageReady=false`。
      responses:
        '200':
          description: 规则目录（最近 50 版）、生效版、内置模板、操作记录与规则文档
          content:
            application/json:
              schema:
                type: object
                required: [items, active, template, stateRevision, storageReady, canWrite, events, document]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RuleRecord'
                  active:
                    $ref: '#/components/schemas/RuleSnapshot'
                  template:
                    $ref: '#/components/schemas/RuleSnapshot'
                  stateRevision:
                    type: integer
                  storageReady:
                    type: boolean
                  canWrite:
                    type: boolean
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        ruleId:
                          type: string
                          format: uuid
                        action:
                          type: string
                        actor:
                          type: string
                        revision:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
                  document:
                    type: string
                    description: 当前生效规则的 Markdown 说明
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: 规则服务/存储未配置（RULES_UNAVAILABLE / 规则存储尚未迁移）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [评分规则]
      summary: 创建规则草稿
      description: |
        需要 `team-services:write`、同源校验、规则写入开关 `EVALUATION_RULES_WRITE_ENABLED=true`。
        `Idempotency-Key` 必须为 UUID；同创建键同请求恢复原记录，冲突返回 409。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, config]
              properties:
                name:
                  type: string
                  maxLength: 100
                changeNote:
                  type: string
                  maxLength: 1000
                config:
                  $ref: '#/components/schemas/RuleConfig'
      responses:
        '201':
          description: 已创建草稿
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/RuleRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 幂等键冲突或规则冲突（RULE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 规则写入未启用/存储未配置（RULE_WRITE_DISABLED / RULES_UNAVAILABLE）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/rules/{id}/save:
    post:
      tags: [评分规则]
      summary: 保存草稿修改
      description: 仅草稿可编辑；revision 过期返回 409 并保留客户端输入。
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/IdempotencyKeyUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, name, config]
              properties:
                revision:
                  type: integer
                  minimum: 1
                name:
                  type: string
                  maxLength: 100
                changeNote:
                  type: string
                  maxLength: 1000
                config:
                  $ref: '#/components/schemas/RuleConfig'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/RuleRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: revision 冲突（RULE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 规则写入未启用（RULE_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/rules/{id}/publish:
    post:
      tags: [评分规则]
      summary: 发布规则版本
      description: 需已保存变更说明；发布后版本内容固定。
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/IdempotencyKeyUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision]
              properties:
                revision:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/RuleRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 状态冲突（RULE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 规则写入未启用（RULE_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/rules/{id}/activate:
    post:
      tags: [评分规则]
      summary: 切换生效版本
      description: 仅已发布版可生效；并发切换会检查生效指针版本（stateRevision）。
      parameters:
        - $ref: '#/components/parameters/RuleId'
        - $ref: '#/components/parameters/IdempotencyKeyUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, stateRevision]
              properties:
                revision:
                  type: integer
                  minimum: 1
                stateRevision:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: 已生效
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/RuleRecord'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 生效指针已变化（RULE_CONFLICT）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 规则写入未启用（RULE_WRITE_DISABLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/evaluation/rules/{id}/archive:
    post:
      tags: [评分规则]
      summary: 归档规则
      description: 生效版禁止归档，历史保留。
      parameters:
