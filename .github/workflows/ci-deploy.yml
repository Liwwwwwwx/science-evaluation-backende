name: CI and Deploy
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ci:
    name: CI
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=1 test/*.test.js
      - name: Verify rerun transactions with isolated PostgreSQL
        run: |
          set -eu
          socket_dir=$(mktemp -d /tmp/evaluation-rerun-pg.XXXXXX)
          chmod 777 "$socket_dir"
          trap 'docker rm -f evaluation-rerun-test >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name evaluation-rerun-test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$socket_dir:/var/run/postgresql" postgres:16 \
            postgres -p 55484 -c listen_addresses=''
          ready=false
          for attempt in $(seq 1 60); do
            if docker logs evaluation-rerun-test 2>&1 | grep -q 'PostgreSQL init process complete' && \
              docker exec evaluation-rerun-test pg_isready -h /var/run/postgresql -p 55484 -U postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs evaluation-rerun-test
            exit 1
          fi
          docker exec evaluation-rerun-test createdb -h /var/run/postgresql -p 55484 -U postgres science_admin
          PGUSER=postgres EVALUATION_RERUN_TEST_PG_SOCKET="$socket_dir" node --test test/rerun-postgres.test.js
      - name: Verify run ownership with isolated PostgreSQL
        run: |
          set -eu
          socket_dir=$(mktemp -d /tmp/evaluation-ownership-pg.XXXXXX)
          chmod 777 "$socket_dir"
          trap 'docker rm -f evaluation-ownership-test >/dev/null 2>&1 || true' EXIT
          docker run --rm -d --name evaluation-ownership-test \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            -v "$socket_dir:/var/run/postgresql" postgres:16 \
            postgres -p 55487 -c listen_addresses=''
          ready=false
          for attempt in $(seq 1 60); do
            if docker logs evaluation-ownership-test 2>&1 | grep -q 'PostgreSQL init process complete' && \
              docker exec evaluation-ownership-test pg_isready -h /var/run/postgresql -p 55487 -U postgres >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            docker logs evaluation-ownership-test
            exit 1
          fi
          docker exec evaluation-ownership-test createdb -h /var/run/postgresql -p 55487 -U postgres science_evaluation
          PGUSER=postgres EVALUATION_OWNERSHIP_TEST_PG_SOCKET="$socket_dir" node --test test/run-ownership-postgres.test.js
      - run: bash -n ops/deploy.sh
      - name: Package release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: git archive --format=tar HEAD | gzip > /tmp/deploy.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: release
          path: /tmp/deploy.tgz
          retention-days: 3
  deploy:
    name: Deploy
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Deploy over SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          REVISION: ${{ github.sha }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 "$DEPLOY_USER@$DEPLOY_HOST" "/usr/local/bin/science-evaluation-deploy backend $REVISION" < deploy.tgz
